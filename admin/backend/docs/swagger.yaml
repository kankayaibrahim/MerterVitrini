openapi: 3.0.3
info:
  title: Merter Vitrini Admin Backend API
  description: High-performance, secure REST API for wholesale textile catalog management & integrations.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: "1. Authentication"
    description: Identity operations, login authentication, and JWT token issue.
  - name: "2. Catalog Management"
    description: Mappings for product models, recursive category trees, and specifications.
  - name: "3. Provider Integrations"
    description: Integration feeds, synchronizations, and background execution workers.
  - name: "4. System Health"
    description: Operations monitoring and health status checks.
paths:
  /api/v1/auth/login:
    post:
      tags:
        - "1. Authentication"
      summary: Initiate Authentication / Login
      description: Verifies user credentials. When OTP is disabled (development mode), this directly issues a signed JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: system@toptantekstil.com
                password:
                  type: string
                  example: Admin123!*
      responses:
        "200":
          description: Authentication successful. Returns JWT token if OTP is bypassed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  require_otp:
                    type: boolean
                    example: false
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        example: super_admin
        "401":
          description: Invalid email or password.
        "403":
          description: User is blocked or inactive.

  /api/v1/auth/verify-otp:
    post:
      tags:
        - "1. Authentication"
      summary: Verify OTP & Issue JWT
      description: Validates the 6-digit OTP code and issues a secure signed JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - otp_code
              properties:
                user_id:
                  type: string
                  format: uuid
                  example: 019e6095-594c-73b1-b8e7-9202256d4f18
                otp_code:
                  type: string
                  example: "751975"
      responses:
        "200":
          description: OTP successfully verified. JWT issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  require_otp:
                    type: boolean
                    example: false
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        example: super_admin
        "401":
          description: Invalid or expired OTP code.

  /api/v1/categories:
    get:
      tags:
        - "2. Catalog Management"
      summary: Get Hierarchical Category Tree
      description: Returns a nested tree structure of all categories. Requires JWT Authentication.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful retrieval of recursive category tree.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
        "401":
          description: Unauthorized.
    post:
      tags:
        - "2. Catalog Management"
      summary: Create Category
      description: Creates a new category. Database will automatically calculate `ltree` path. Requires JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Ust Giyim
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                  example: 019e60a1-90f7-71cb-b8c3-2bd9ac018591
                is_active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "401":
          description: Unauthorized.

  /api/v1/products:
    get:
      tags:
        - "2. Catalog Management"
      summary: Paginated Search Products
      description: Lists products with pagination and query filters. Performs recursive child category searches using `ltree` matching. Requires JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Text query matching title, custom SKU, or description
          required: false
          schema:
            type: string
        - name: brand_id
          in: query
          description: Filter by Brand ID
          required: false
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          description: Filter by Category ID (returns category products and all its child categories recursively)
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of items to return (default 20)
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Pagination offset (default 0)
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of products matching filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "401":
          description: Unauthorized.

  /api/v1/products/{id}:
    get:
      tags:
        - "2. Catalog Management"
      summary: Get Product Details
      description: Returns a single product with full color/size variants and cover images. Requires JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detailed product data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailed'
        "401":
          description: Unauthorized.
        "404":
          description: Product not found.

  /api/v1/feeds:
    get:
      tags:
        - "3. Provider Integrations"
      summary: List Wholesale XML Feeds
      description: Lists wholesale integration feeds defined in the system. Requires JWT.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Feeds retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XmlFeed'
        "401":
          description: Unauthorized.

  /api/v1/feeds/{id}/sync:
    post:
      tags:
        - "3. Provider Integrations"
      summary: Trigger XML Synchronization
      description: Initiates a simulated background sync run session. Instantly returns "running" state while execution continues in background threads. Requires JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Feed short-code (e.g. lustrin, etika)
          schema:
            type: string
      responses:
        "202":
          description: Sync successfully triggered in background.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        "401":
          description: Unauthorized.
        "404":
          description: XML Feed not found.

  /api/v1/feeds/{id}/syncs:
    get:
      tags:
        - "3. Provider Integrations"
      summary: List Sync Runs History
      description: Retrieves historical run sessions and results/statistics for a specific XML feed. Requires JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Feed short-code
          schema:
            type: string
      responses:
        "200":
          description: List of sync runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncRun'
        "401":
          description: Unauthorized.

  /health:
    get:
      tags:
        - "4. System Health"
      summary: Service Health Check
      description: Returns health status of the API and database connectivity.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  database:
                    type: string
                    example: connected

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        slug:
          type: string
        node_path:
          type: string
          example: 019e60a190f771cbb8c32bd9ac018591.019e60a1b3a67a58b91b8da2481a9ae9
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CategoryNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        slug:
          type: string
        node_path:
          type: string
        is_active:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feed_id:
          type: string
          nullable: true
        source_product_id:
          type: string
        title:
          type: string
        slug:
          type: string
        custom_sku:
          type: string
          example: MIMOZA-129482
        brand_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        brand_name:
          type: string
          nullable: true
        category_title:
          type: string
          nullable: true
        is_active:
          type: boolean

    ProductDetailed:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            short_description:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            desi_volume:
              type: number
            shipping_weight_kg:
              type: number
            packing_ratio:
              type: string
              nullable: true
            series_ratio:
              type: string
              nullable: true
            minimum_order_quantity:
              type: integer
            variants:
              type: array
              items:
                $ref: '#/components/schemas/ProductVariant'
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'

    ProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        custom_sku:
          type: string
          example: MIMOZA-129482-SIYAH-S
        stock:
          type: integer
        price:
          type: number
        discounted_price:
          type: number
          nullable: true
        tax_rate:
          type: number
        currency:
          type: string
          example: TRY
        color:
          type: string
          nullable: true
        size:
          type: string
          nullable: true
        is_active:
          type: boolean

    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_url:
          type: string
        sort_order:
          type: integer
        is_cover:
          type: boolean

    XmlFeed:
      type: object
      properties:
        id:
          type: string
          example: lustrin
        name:
          type: string
          example: Lustrin Toptan Tekstil
        alias_code:
          type: string
          example: MIMOZA
        is_active:
          type: boolean

    SyncRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feed_id:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          example: running
        summary:
          type: object
          nullable: true
          properties:
            items_parsed:
              type: integer
            items_added:
              type: integer
            items_updated:
              type: integer
            variants_aligned:
              type: integer
            errors_skipped:
              type: integer
